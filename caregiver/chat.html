<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ally · Demo chat</title>
<style>
  :root{--bg:#0f1318;--panel:#171d25;--you:#2d6cdf;--guard:#222b36;--text:#f2f5f9;--dim:#8a97a6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 20px;background:var(--panel);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26303c}
  header b{font-size:18px}
  header small{color:var(--dim)}
  button{background:#26303c;color:var(--text);border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
  #log{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto}
  .row{display:flex;flex-direction:column;max-width:80%}
  .row.you{align-self:flex-end;align-items:flex-end}
  .row.guard{align-self:flex-start;align-items:flex-start}
  .who{font-size:12px;color:var(--dim);margin:0 6px 4px}
  .bubble{padding:14px 18px;border-radius:18px;font-size:22px;line-height:1.35}
  .you .bubble{background:var(--you);border-bottom-right-radius:4px}
  .guard .bubble{background:var(--guard);border-bottom-left-radius:4px}
  #empty{color:var(--dim);text-align:center;margin-top:30vh;font-size:18px}
</style>
</head>
<body>
<header>
  <div><b>Ally</b> <small id="st">connecting…</small></div>
  <button id="clear">Clear</button>
</header>
<div id="log"><div id="empty">Waiting for speech. Say “Hey Ally, what time is it?”</div></div>
<script>
let last = 0;
const log = document.getElementById('log'), st = document.getElementById('st');
function add(m) {
  document.getElementById('empty')?.remove();
  const row = document.createElement('div'); row.className = 'row ' + m.role;
  const who = document.createElement('div'); who.className = 'who';
  who.textContent = (m.role === 'you' ? 'You' : 'Ally') + ' · ' + new Date(m.at).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit', second: '2-digit'});
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = m.text;
  row.append(who, b); log.append(row);
}
async function tick() {
  try {
    const r = await fetch('/chat?since=' + last);
    if (r.status === 404) { st.textContent = 'Open this page on the laptop itself: http://localhost:8787/chat.html'; return; }
    const msgs = await r.json();
    st.textContent = 'live';
    if (msgs.length) { msgs.forEach(m => { add(m); last = Math.max(last, m.id); }); log.scrollTop = log.scrollHeight; }
  } catch { st.textContent = 'server not reachable'; }
}
document.getElementById('clear').onclick = async () => {
  await fetch('/chat', {method: 'DELETE'}); log.innerHTML = '<div id="empty">Cleared.</div>'; last = 0;
};
tick(); setInterval(tick, 700);
</script>
</body>
</html>
