<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ally · Demo chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/theme.css">
</head>
<body class="chat">
<header>
  <div><b>Ally</b> <small id="st">connecting…</small></div>
  <button id="clear">Clear</button>
</header>
<div id="log" class="chatlog"><div id="empty">Waiting for speech. Say “Hey Ally, what time is it?”</div></div>
<script>
let last = 0;
const log = document.getElementById('log'), st = document.getElementById('st');
function add(m) {
  document.getElementById('empty')?.remove();
  const row = document.createElement('div'); row.className = 'row ' + m.role;
  const who = document.createElement('div'); who.className = 'who';
  who.textContent = (m.role === 'you' ? 'You' : 'Ally') + ' · ' + new Date(m.at).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit', second: '2-digit'});
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = m.text;
  row.append(who, b); log.append(row);
}
async function tick() {
  try {
    const r = await fetch('/chat?since=' + last);
    if (r.status === 404) { st.textContent = 'Open this page on the laptop itself: http://localhost:8787/chat.html'; return; }
    const msgs = await r.json();
    st.textContent = 'live';
    if (msgs.length) { msgs.forEach(m => { add(m); last = Math.max(last, m.id); }); log.scrollTop = log.scrollHeight; }
  } catch { st.textContent = 'server not reachable'; }
}
document.getElementById('clear').onclick = async () => {
  await fetch('/chat', {method: 'DELETE'}); log.innerHTML = '<div id="empty">Cleared.</div>'; last = 0;
};
tick(); setInterval(tick, 700);
</script>
</body>
</html>
